name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'eas.json'
      - 'index.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloom-planner-${{ github.sha }}-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: bloom-planner-${{ github.sha }}-metadata
          path: |
            app.json
            package.json
            pnpm-lock.yaml
          retention-days: 30

      - name: Prepare release metadata
        id: release
        run: |
          version=$(node -p "require('./app.json').expo.version")
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          apk=$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "No release APK found" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_APK: ${{ steps.release.outputs.apk }}
        run: |
          gh release create "$RELEASE_TAG" "$RELEASE_APK#Bloom Planner ${RELEASE_VERSION} APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Bloom Planner ${RELEASE_VERSION} APK" \
            --notes "Automated Android APK build from commit ${GITHUB_SHA}. Download the APK from the Assets section below."

      - name: Write job summary
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          {
            echo "## Bloom Planner APK"
            echo ""
            echo "Version: **${RELEASE_VERSION}**"
            echo ""
            echo "Source commit: `${GITHUB_SHA}`"
            echo ""
            echo "GitHub Release: [${RELEASE_TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG})"
          } >> "$GITHUB_STEP_SUMMARY"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
